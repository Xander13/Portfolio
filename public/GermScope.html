<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GermScope</title>
    <link rel="stylesheet" href="css/cssReset.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="topNav">
        <div class="flexBox">
            <div class="flexBox">
                <div class="flexBox">
                    <img src="img/GermScope.svg" height="23px" alt="logo of virus">
                    <a href="#">Home</a>
                    <a href="#">Database</a>
                    <a href="#">About</a>
                    <a href="#">FAQ</a>
                </div>
                <h2>Virus Database <span>&blacktriangledown;</span></h2>
            </div>
        </div>
    </div>
    <main>
        <div class="timeline" id="timeline">
            <div class="timelineHeader">
                <span class="timelineTitle">Today</span>
                <span class="timelineHeaderLine"></span>
            </div>
        </div>
        <div class="viewWindow">
            <div class="canvasWrap">
                <canvas class="model"></canvas>
                <div id="controls">
                    <button id="btn-rotate">Stop Rotation</button>
                </div>
                <button class="exploreButton" type="button">Explore Virus</button>
            </div>
            <div class="dataInfo" id="dataInfo"></div>
        </div>
    </main>
    <style>
        body,
        html {
            background-color: rgb(17, 17, 17);
            height: 100%;
            overflow: hidden;
            scrollbar-width: none;
        }

        .topNav {
            border-bottom: 1px solid rgb(77, 77, 77);
            background-color: rgb(17, 17, 17);
            padding: 24px;
            position: fixed;
            left: 0;
            right: 0;
        }

        main {
            padding-top: 77px;
            height: 100%;
            overflow: auto;
            display: flex;
            padding-left: 22px;
            scrollbar-width: none;
        }

        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        img,
        span {
            color: white;
            text-decoration: none;
            font-family: "Bricolage Grotesque", sans-serif;
            font-weight: 400;
        }

        ::selection {
            background-color: white;
            color: black;
        }

        .flexBox {
            display: flex;
            justify-content: space-between;
            gap: 32px;
            align-items: center;
            width: fit-content;
        }

        .topNav>.flexBox {
            width: 100%;
        }

        .topNav>.flexBox>.flexBox {
            width: 100%;
        }

        h2 {
            font-size: 18px !important;
            font-weight: 400;
        }

        .canvasWrap {
            width: 50%;
            position: relative;
            aspect-ratio: 1 / 1;
            box-sizing: border-box;
            background: transparent;
        }

        .model {
            width: 100%;
            height: 100%;
            border: 1px solid rgb(77, 77, 77);
            box-sizing: border-box;
            border-radius: 100rem;
            display: block;
            background: rgba(255, 255, 255, 0.02);
        }

        .timeline {
            width: 64px;
            padding-top: 32px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            overflow-y: auto;
            position: relative;
            scrollbar-width: none;
        }

        .timeline::-webkit-scrollbar {
            display: none;
        }

        .timelineHeader {
            align-items: center;
            display: flex;
            flex-direction: column;
            flex: 0 0 120px;
            gap: 8px;
            min-height: 120px;
            width: 100%;
        }

        .timelineTitle {
            color: white;
            font-family: "Bricolage Grotesque", sans-serif;
            font-size: 12px;
            white-space: nowrap;
        }

        .timelineHeaderLine {
            background-color: rgb(77, 77, 77);
            flex: 1;
            width: 1px;
        }

        .year {
            align-items: center;
            background-color: rgb(17, 17, 17);
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 120px;
            position: relative;
            width: 100%;
            z-index: 1;
        }

        .yearMarker {
            height: 16px;
            position: relative;
            width: 100%;
        }

        .yearLine {
            background-color: rgb(77, 77, 77);
            flex: 1;
            margin-top: -8px;
            min-height: 0;
            width: 1px;
        }

        .yearLabel {
            background-color: rgb(17, 17, 17);
            color: white;
            font-family: "Bricolage Grotesque", sans-serif;
            font-size: 12px;
            position: absolute;
            right: calc(50% + 8px);
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            transform-origin: center;
            white-space: nowrap;
            z-index: 1;
        }

        .yearDot {
            appearance: none;
            background-color: white;
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            height: 8px;
            margin: 0;
            left: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            z-index: 1;
        }

        .yearDot:checked {
            box-shadow: 0 0 0 3px rgb(17, 17, 17), 0 0 0 4px white;
        }

        .viewWindow {
            display: flex;
            flex-direction: row;
            width: 100%;
        }

        .canvasWrap {
            position: relative;
            max-width: 1200px;
            max-height: 1200px;
            margin: 56px;
            aspect-ratio: 1 / 1;
            box-sizing: border-box;
            background: transparent;
        }

        .model {
            position: relative;
            z-index: 0;
            width: 100%;
            height: 100%;
            border: 1px solid rgb(77, 77, 77);
            box-sizing: border-box;
            border-radius: 100rem;
            display: block;
            background: rgba(255, 255, 255, 0.02);
        }

        .dataInfo {
            width: 50%;
        }

        .dataInfo h1,
        .dataInfo p {
            text-wrap: balance;
        }

        .dataInfo span {
            padding-left: 8px;
            padding-right: 8px;
        }

        .exploreButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            font-size: 22px;
            line-height: 1.2;
            color: white;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 999px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0.5;
            cursor: pointer;
            user-select: none;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease, background 0.2s ease;
        }

        .exploreButton:hover {
            opacity: 1;
            pointer-events: all;
            background: rgba(255, 255, 255, 0.12);
        }

        .dataInfo {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 32px;
            justify-content: center;
            padding: 56px 56px 56px 0;
            color: white;
        }

        .dataInfo h1,
        .dataInfo h2,
        .dataInfo p {
            margin: 0;
        }

        .dataInfo h2 {
            font-size: 18px;
            font-weight: 400;
        }

        .dataInfo h1 {
            font-size: clamp(2rem, 3vw, 3rem);
            line-height: 1.1;
        }

        .dataInfo .family,
        .dataInfo .milestone {
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.5;
        }

        .transmissionRow {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 12px;
        }

        .transmissionItem {
            align-items: center;
            border: 1px solid rgb(77, 77, 77);
            border-radius: 999px;
            display: inline-flex;
            flex-direction: row;
            padding: 8px 12px;
            white-space: nowrap;
        }

        .transmissionIcon {
            font-size: 14px;
        }
    </style>
    <script>
        const timeline = document.querySelector("#timeline");
        const dataInfo = document.querySelector("#dataInfo");

        function renderDataInfo(virus) {
            const transmissionParts = String(virus.transmission_mode || "")
                .split(/[\/]/)
                .map((part) => part.trim())
                .filter(Boolean);

            const transmissionMarkup = transmissionParts.length
                ? transmissionParts.map((mode) => `
                    <div class="transmissionItem">
                        <span class="transmissionIcon">✦</span>
                        <span>${mode}</span>
                    </div>
                `).join("")
                : `
                    <div class="transmissionItem">
                        <span class="transmissionIcon">✦</span>
                        <span>${virus.transmission_mode || "Transmission mode unavailable"}</span>
                    </div>
                `;

            dataInfo.innerHTML = `
                <div>
                    <h2>${virus.year}</h2>
                </div>
                <div>
                    <h1>${virus.virus}</h1>
                </div>
                <div>
                    <p class="family"><strong>Family:</strong> ${virus.family}</p>
                </div>
                <div>
                    <div class="transmissionRow">${transmissionMarkup}</div>
                </div>
                <div>
                    <p class="milestone"><strong>Milestone:</strong> ${virus.milestone}</p>
                </div>
            `;
        }

        fetch("../viralZon.json")
            .then((response) => response.json())
            .then((viruses) => {
                const sortedViruses = viruses
                    .filter((virus) => virus.year)
                    .sort((firstVirus, secondVirus) =>
                        Number(secondVirus.year) - Number(firstVirus.year)
                    );

                sortedViruses.forEach((virus, index) => {
                    const year = document.createElement("div");
                    year.className = "year";
                    year.innerHTML = `
                        <div class="yearMarker">
                            <span class="yearLabel">${virus.year}</span>
                            <input class="yearDot" type="radio" name="discoveryYear"
                                aria-label="${virus.year}" ${index === 0 ? "checked" : ""}>
                        </div>
                        <span class="yearLine"></span>
                    `;

                    const radio = year.querySelector(".yearDot");
                    radio.addEventListener("change", () => {
                        if (radio.checked) {
                            renderDataInfo(virus);
                        }
                    });

                    timeline.append(year);
                });

                if (sortedViruses.length > 0) {
                    renderDataInfo(sortedViruses[0]);
                }
            });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // --- TARGET EXISTING CANVAS ---
        const canvasElement = document.querySelector('canvas.model');

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05050a, 0.015);

        const width = canvasElement.clientWidth || window.innerWidth;
        const height = canvasElement.clientHeight || window.innerHeight;

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(12, 8, 15);

        // Bind WebGLRenderer to your specific canvas class
        const renderer = new THREE.WebGLRenderer({
            canvas: canvasElement,
            antialias: true
        });
        renderer.setSize(width, height, false);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x00f3ff, 2, 50);
        pointLight1.position.set(10, 15, 10);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff3366, 2, 50);
        pointLight2.position.set(-10, -10, -10);
        scene.add(pointLight2);

        // --- MPOX VIRUS GROUP ---
        const virusGroup = new THREE.Group();
        scene.add(virusGroup);

        // 1. Outer Lipoprotein Envelope (Oval Ellipsoid Shape)
        const envelopeGeo = new THREE.SphereGeometry(2.2, 32, 32);
        const envelopeMat = new THREE.MeshPhysicalMaterial({
            color: 0x00f3ff,
            transparent: true,
            opacity: 0.25,
            roughness: 0.1,
            metalness: 0.1,
            transmission: 0.6,
            ior: 1.4,
            wireframe: false
        });
        const envelopeMesh = new THREE.Mesh(envelopeGeo, envelopeMat);
        envelopeMesh.scale.set(1.6, 1.0, 1.0);
        virusGroup.add(envelopeMesh);

        // 2. Core (Oval shape core matching symmetry)
        const coreGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const coreMat = new THREE.MeshStandardMaterial({
            color: 0xff3366,
            roughness: 0.3,
            metalness: 0.4,
            wireframe: false
        });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        coreMesh.scale.set(1.5, 0.8, 0.8);
        virusGroup.add(coreMesh);

        // 3. Lateral Bodies (Oval shape bodies)
        let lateralBody1, lateralBody2;
        const bodyGeo = new THREE.SphereGeometry(0.7, 32, 32);
        const bodyMat = new THREE.MeshStandardMaterial({
            color: 0xffaa00,
            roughness: 0.4,
            metalness: 0.3,
            wireframe: false
        });

        lateralBody1 = new THREE.Mesh(bodyGeo, bodyMat);
        lateralBody1.scale.set(1.3, 0.6, 0.6);
        lateralBody1.position.set(0, 0.8, 0);
        virusGroup.add(lateralBody1);

        lateralBody2 = new THREE.Mesh(bodyGeo, bodyMat);
        lateralBody2.scale.set(1.3, 0.6, 0.6);
        lateralBody2.position.set(0, -0.8, 0);
        virusGroup.add(lateralBody2);

        // Surface Spikes (Cone points positioned inside, facing/pointing toward origin)
        const coneHeight = 0.4;
        const spikeGeo = new THREE.ConeGeometry(0.08, coneHeight, 4);
        spikeGeo.translate(0, coneHeight / 2, 0);

        const spikeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
        const spikeCount = 120;

        for (let i = 0; i < spikeCount; i++) {
            const spike = new THREE.Mesh(spikeGeo, spikeMat);
            
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            
            let x = 3.52 * Math.sin(phi) * Math.cos(theta);
            let y = 2.2 * Math.sin(phi) * Math.sin(theta);
            let z = 2.2 * Math.cos(phi);

            spike.position.set(0, 0, 0); // Point starts at center/inside
            spike.lookAt(x, y, z);       // Point outward toward surface position
            spike.rotateX(Math.PI / 2);  // Align base to surface normal
            spike.position.set(x, y, z); // Anchor base on surface
            
            virusGroup.add(spike);
        }

        // --- INTERACTION LOGIC ---
        let isRotating = true;

        const btnRotate = document.getElementById('btn-rotate');
        if (btnRotate) {
            btnRotate.addEventListener('click', () => {
                isRotating = !isRotating;
            });
        }

        // --- ANIMATION LOOP & RESIZE HANDLING ---
        function animate() {
            requestAnimationFrame(animate);

            const currentWidth = canvasElement.clientWidth;
            const currentHeight = canvasElement.clientHeight;
            if (canvasElement.width !== currentWidth || canvasElement.height !== currentHeight) {
                renderer.setSize(currentWidth, currentHeight, false);
                camera.aspect = currentWidth / currentHeight;
                camera.updateProjectionMatrix();
            }

            if (isRotating) {
                virusGroup.rotation.y += 0.001;
                virusGroup.rotation.x += 0.001;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>

</html>
