<body>
    <div class="nav">
        <div class="flexBox">
            <h2>Alex Kauffman</h2>
            <div class="flexBox" style="gap: 32px;">
                <h2>Work</h2>
                <h2>Resume</h2>
                <h2>AI Mode</h2>
            </div>
        </div>
    </div>
    <div class="aiBox">
        <div class="responseBox"></div>
        <div class="inputBox">
            <div class="flexBox">
                <input class="txtBox" autocomplete="off" name="no-autofill" type="text" id="llmTxt"
                    placeholder="Ask Alex...">
                <div class="send">Send</div>
            </div>
        </div>
        <!-- <h5>Alex Bot is only for portfolio inquiring.</h5> -->
    </div>

    <style>
        :root {
            --primary-color: #000000;
            --secondary-color: #f9f9f9;
            --text-color: #f9f9f9;
            --accent-color: #ff6600;
        }

        body {
            background-color: var(--primary-color);
        }

        .aiIcon {
            height: 100px;
            width: fit-content;
            position: fixed;
            right: 32px;
            bottom: 32px;
            z-index: 444433333;
        }

        .mediaSlideIn {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .mediaSlideIn.show {
            opacity: 1;
            transform: translateY(0);
        }


        p,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        input[type=text],
        .send,
        a {
            font-family: monospace;
        }

        .aiBox {
            /* text-align: center;
            position: absolute;
            bottom: 0;
            text-align: balance; */
        }

        h5 {
            position: fixed;
            bottom: 22px;
            letter-spacing: -0.5px;
            font-size: 14px;
            color: gray;
            font-weight: 400;
            text-align: center;
            left: 0;
            right: 0;
            text-transform: uppercase;
        }

        a {
            text-align: none;
            color: var(--secondary-color);
            text-underline-offset: 4px;
        }

        h6 {
            font-size: 18px;
            color: var(--secondary-color);
            font-weight: 400;
        }

        /* Chat message wrapper */
        /* Chat message wrapper */
        .aiMsg,
        .userMsg {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* Sender label stays left-aligned */
        .aiMsg h6,
        .userMsg h6 {
            font-size: 18px;
            margin: 0 0 8px 0;
            color: #999;
            text-align: left;
            width: 50%;
            max-width: 50%;
            margin: 32px auto;
            /* force left-aligned */
        }

        /* Message text centered without shrinking weirdly */
        .aiMsg p,
        .userMsg p {
            width: 50%;
            max-width: 50%;
            margin: 32px auto;
            /* top/bottom spacing + horizontal center */
            font-size: 20px;
            line-height: 1.8;
            color: white;
            word-wrap: break-word;
            flex-shrink: 0;
            /* prevents shrinking in flex layout */
        }

        /* Media grid centered */
        .aiMsg .mediaWrapper,
        .userMsg .mediaWrapper {
            width: 80%;
            max-width: 80%;
            margin: 16px auto 32px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .aiMsg .mediaWrapper>div,
        .userMsg .mediaWrapper>div {
            flex: 1 1 calc(50% - 4px);
            max-width: calc(50% - 4px);
        }

        .aiMsg .mediaWrapper img,
        .aiMsg .mediaWrapper video,
        .userMsg .mediaWrapper img,
        .userMsg .mediaWrapper video {
            width: 100%;
            display: block;
        }

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            padding-left: 64px;
            padding-right: 64px;
            padding-top: 64px;
            padding-bottom: 32px;
            box-sizing: border-box;
            z-index: 1111111;
        }

        .nav .flexBox {
            justify-content: space-between;
        }

        .nav h2 {
            color: white;
            font-weight: 300;
        }

        .logo {
            height: 48px;
            width: fit-content;
        }

        .xbttn {
            height: 48px;
            width: fit-content;
            position: absolute;
            right: 64px;
            cursor: pointer;
            transform: rotate(-45deg);
        }

        /*Promopt */
        .promptContainer {
            display: flex;
            gap: 16px;
            margin-top: 16px;
            margin-bottom: 56px;
        }

        .promptBox {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            opacity: 0;
            /* start hidden */
            transform: translateY(20px);
            /* slightly move down */
            transition: opacity 0.6s ease, transform 0.6s ease;
            /* smooth fade + move */
        }

        .promptBox.visible {
            opacity: 1;
            transform: translateY(0);
            /* move to normal position */
        }

        .promptBtn {
            display: block;
            background-color: #2a2a2a;
            cursor: pointer;
            overflow: hidden;
            border-radius: 4px;
            margin-bottom: 0 !important;
            transition: background-color 0.2s ease;
        }

        .promptBtn img {
            transform: scale(1);
            transition: 0.5s ease;
        }

        .promptBtn:hover img {
            transform: scale(1.05);
            transition: 0.5s ease;
        }

        .promptBtn span {
            margin-left: 32px;
            margin-right: 32px;
        }

        .promptBtn span:first-child {
            padding-top: 32px;
        }

        .promptBtn img {
            width: 100%;

        }

        .promptBtn p {
            padding: 32px;
        }

        .promptBtn:hover {
            background-color: #151515;
        }

        /*--------*/

        .aiBox {
            position: relative;
            background-color: var(--primary-color);
            z-index: 888888;
            height: calc(100% - 112px);
            box-sizing: border-box;
        }

        .responseBox {
            overflow-y: auto;
            height: 100%;
            z-index: 1;
            padding-top: 40vh;
        }

        .responseBox::-webkit-scrollbar {
            width: 0px;
        }

        .responseBox p {
            font-size: 1.875rem;
            line-height: 3.4rem;
            margin-top: 32px;
            margin-bottom: 120px;
            text-wrap: wrap;
            color: white;
        }

        .send {
            width: fit-content;
            padding-left: 28px;
            padding-right: 28px;
            padding-top: 8px;
            padding-bottom: 8px;
            box-sizing: border-box;
            display: flex;
            justify-content: stretch;
            align-items: center;
            background-color: var(--accent-color);
            border: none;
            color: var(--secondary-color);
            box-sizing: border-box;
            cursor: pointer;
            font-size: 20px;
            border-radius: 100rem;
        }

        .LlmTxt {
            border-radius: 0 !important;
            border: none !important;
            background-color: var(--secondary-color) !important;
            width: 100% !important;
            margin: 0 !important;
            box-sizing: border-box;
            padding-left: 32px;
            padding-right: 32px;
        }

        .txtBox {
            width: 100% !important;
            border-radius: 0 !important;
            border: none !important;
            background-color: var(--secondary-color) !important;
            margin: 0 !important;
            height: 100%;
        }

        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #121212 inset;
            -webkit-text-fill-color: var(--secondary-color);
            transition: background-color 5000s ease-in-out;
        }

        .inputBox {
            position: fixed;
            bottom: 56px;
            z-index: 12;
            width: 100%;
            padding-bottom: 32px;
            margin: auto;
            padding-top: 32px;
            box-sizing: border-box;
            background-color: rgb(0, 0, 0);
        }

        .inputBox .flexBox{
            width: 50%;
            margin: auto;
              border-bottom: 1px solid white;
        }

        input[type=text] {
            font-size: 32px;
            color: var(--secondary-color);
            background-color: transparent !important;
        }

        input[type=text]:focus {
            outline: none;
        }

        .flexBox {
            display: flex;
        }

        .inputBox .flexBox {
            align-items: stretch !important;
            height: 100%;
            flex-wrap: nowrap;
        }

        @media screen and (max-width: 930px) {

            .aiMsg,
            .userMsg {
                display: flex;
                flex-direction: column;
                width: 100%;
                margin: auto;
                gap: 4px;
            }

            .mediaWrapper>div {
                flex: 1 1 100%;
            }

            .promptContainer {
                flex-direction: column;
            }

            .promptBox {
                flex: 1 1 100%;
            }

            .responseBox {
                padding: 32px;
            }

            .nav {
                padding-left: 32px;
            }

            .xbttn {
                right: 32px;
            }

            .responseBox p {
                font-size: 18px;
                letter-spacing: -0.5px;
                line-height: calc(20px * 1.2);
                margin-bottom: 20px;
            }

            .inputBox {
                height: fit-content;
                height: 72px;
                width: calc(100% - 32px);
                bottom: 16px;
            }

            input[type=text] {
                font-size: 18px;
                letter-spacing: -0.5px;
                touch-action: auto;
            }

            .promptContainer {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .promptBox {
                width: 100%;
                gap: 4px;
            }

            .aiBox {
                height: calc(100% - 76px);
            }
        }
    </style>
</body>

</html>
<script src="aiMode.js"></script>
