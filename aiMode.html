<body>
    <div class="aiBox">
        <div class="responseBox"></div>
        <div class="inputBox">
            <div class="flexBox">
                <input class="txtBox" type="text" id="llmTxt" placeholder="Ask Alex...">
                <div class="send">Send</div>
            </div>
        </div>
    </div>
    <style>
        p,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        input[type=text],
        .send,
        a {
            font-family: monospace;
        }

        a {
            text-align: none;
            color: white;
            text-underline-offset: 4px;
        }

        .aiBox {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            top: 0;
            background-color: black;
            padding: 32px;
            z-index: 888888;
            height: 100%;
            box-sizing: border-box;
        }

        .responseBox {
            overflow-y: auto;
            height: 100%;
            padding-bottom: 120px;
            z-index: 1;
        }

        .responseBox p {
            font-size: 32px;
            line-height: calc(32px * 1.2);
            margin-bottom: 20px;
            color: white;
        }

        .responseBox p {
            margin-bottom: 20px;
            color: white;
            text-wrap: wrap;
        }

        .userMsg p,
        .aiMsg p {
            padding: 10px 0;
        }

        .send {
            width: fit-content;
            padding-left: 24px;
            padding-right: 56px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
            border: none;
            color: white;
            box-sizing: border-box;
            cursor: pointer;
            font-size: 32px;
            line-height: calc(32px * 1.2);
        }

        .LlmTxt {
            border-radius: 0 !important;
            border: none !important;
            background-color: black !important;
            width: 100% !important;
            margin: 0 !important;
            box-sizing: border-box;
            padding-left: 32px;
            padding-right: 32px;
        }

        .txtBox {
            width: 100% !important;
            border-radius: 0 !important;
            border: none !important;
            background-color: black !important;
            margin: 0 !important;
            height: fit-content !important;
        }

        .inputBox {
            position: absolute;
            z-index: 3;
            bottom: 0;
            left: 0;
            right: 0;
            height: fit-content !important;
        }

        input[type=text] {
            font-size: 32px;
            line-height: calc(32px * 1.2);
            height: fit-content;
            padding-top: 24px !important;
            padding-bottom: 24px !important;
            padding-left: 32px;
            color: white;
        }

        input[type=text]:focus {
            outline: none;
        }

        .flexBox {
            display: flex;
        }

        .inputBox .flexBox {
            align-items: stretch !important;
            height: 100%;
            flex-wrap: nowrap;
        }

        @media screen and (max-width: 930px) {
            .responseBox p {
                font-size: 24px;
                line-height: calc(24px * 1.2);
                margin-bottom: 20px;
                color: white;
            }

            .send {
                font-size: 24px;
                line-height: calc(24px * 1.2);
                padding-right: 32px;
                background-color: #1a1a1a !important;
            }

            input[type=text] {
                font-size: 24px;
                line-height: calc(24px * 1.2);
                touch-action: auto;
                background-color: #111 !important;
            }
        }
    </style>
</body>
