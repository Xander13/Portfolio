<body>
    <!-- <div class="nav">
        <div class="flexBox">
            <img class="logo" src="aLogo.svg" width="100%" alt="Alex Logo">
            <img class="xbttn" src="xbttn.svg" width="100%" alt="close button">
        </div>

    <div class="aiBox">
        <div class="responseBox"></div>
        <div class="inputBox">
            <div class="flexBox">
                <input class="txtBox" autocomplete="off" name="no-autofill" type="text" id="llmTxt"
                    placeholder="Ask Alex...">
                <div class="send">Send</div>
            </div>
        </div>
    </div>
    <style>
        body {
            background-color: whitesmoke;
        }

        p,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        input[type=text],
        .send,
        a {
            font-family: monospace;
        }

        a {
            text-align: none;
            color: black;
            text-underline-offset: 4px;
        }

        h6 {
            font-size: 18px;
            color: black;
            font-weight: 400;
        }

        /* Chat message wrapper */
        .aiMsg,
        .userMsg {
            display: flex;
            flex-direction: column;
            width: 50%;
            margin: auto;
            gap: 4px;
        }

        .aiMsg>p,
        .userMsg>p,
        .aiMsg .mediaWrapper,
        .userMsg .mediaWrapper {
            max-width: 100%;
        }

        /* Sender label */
        .aiMsg h6,
        .userMsg h6 {
            font-size: 18px;
            /* smaller label text */
            margin: 0;
            color: #999;
        }

        /* Actual message */
        .aiMsg p,
        .userMsg p {
            font-size: 20px;
            margin: 0;
        }

        /* Media section inside AI messages */
        .aiMsg .mediaWrapper {
            width: 100%;
            /* full width under message text */
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* Media items inside wrapper */
        .aiMsg .mediaWrapper>div {
            flex: 1 1 calc(100% - 4px);
            /* two items per row */
            max-width: calc(100% - 4px);
        }


        .nav {
            position: relative;
            z-index: 100;
            padding-left: 64px;
            padding-right: 64px;
            padding-top: 32px;
            padding-bottom: 32px;
            background-color: whitesmoke;
            height: fit-content;
        }

        .logo {
            height: 48px;
            width: fit-content;
        }

        .xbttn {
            height: 48px;
            width: fit-content;
            position: absolute;
            right: 64px;
            cursor: pointer;
            transform: rotate(-45deg);
        }

        /*Promopt */
        .promptContainer {
            display: flex;
            gap: 16px;
            margin-top: 16px;
            margin-bottom: 56px;
        }

        .promptBox {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            opacity: 0;
            /* start hidden */
            transform: translateY(20px);
            /* slightly move down */
            transition: opacity 0.6s ease, transform 0.6s ease;
            /* smooth fade + move */
        }

        .promptBox.visible {
            opacity: 1;
            transform: translateY(0);
            /* move to normal position */
        }

        .promptBtn {
            display: block;
            padding: 32px 32px;
            background-color: #dddddd;
            cursor: pointer;
            margin-bottom: 0 !important;
            transition: background-color 0.2s ease;
        }

        .promptBtn:hover {
            background-color: #c4c4c4;
        }

        /*--------*/

        .aiBox {
            position: relative;
            background-color: whitesmoke;
            z-index: 888888;
            height: calc(100% - 112px);
            box-sizing: border-box;
        }

        .responseBox {
            overflow-y: auto;
            height: 100%;
            z-index: 1;
            padding: 64px;
        }

        .responseBox::-webkit-scrollbar {
            width: 5px;
        }

        .responseBox::-webkit-scrollbar-track {
            background-color: whitesmoke;
        }

        .responseBox::-webkit-scrollbar-thumb {
            background: black;
        }

        .responseBox::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .responseBox p {
            font-size: 20px;
            line-height: calc(32px * 1.2);
            margin-bottom: 20px;
            color: black;
        }

        .responseBox p {
            margin-bottom: 20px;
            color: black;
            text-wrap: wrap;
        }

        .send {
            width: fit-content;
            padding-left: 28px;
            padding-right: 28px;
            padding-top: 8px;
            padding-bottom: 8px;
            box-sizing: border-box;
            display: flex;
            justify-content: stretch;
            align-items: center;
            background-color: rgb(211, 211, 211);
            border: none;
            color: black;
            box-sizing: border-box;
            cursor: pointer;
            font-size: 20px;
            border-radius: 100rem;
        }

        .send:hover {
            background-color: #e6590c;
            color: white;
        }

        .LlmTxt {
            border-radius: 0 !important;
            border: none !important;
            background-color: whitesmoke !important;
            width: 100% !important;
            margin: 0 !important;
            box-sizing: border-box;
            padding-left: 32px;
            padding-right: 32px;
        }

        .txtBox {
            width: 100% !important;
            border-radius: 0 !important;
            border: none !important;
            background-color: whitesmoke !important;
            margin: 0 !important;
            height: 100%;
            padding-left: 24px;
        }

        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #121212 inset;
            -webkit-text-fill-color: white;
            transition: background-color 5000s ease-in-out;
        }

        .inputBox {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            width: 50%;
            height: 86px;
            padding: 14px 18px;
            border-radius: 100rem;
            box-sizing: border-box;
            background-color: #ffffff;
        }

        input[type=text] {
            font-size: 20px;
            color: black;
            background-color: transparent !important;
        }

        input[type=text]:focus {
            outline: none;
        }

        .flexBox {
            display: flex;
        }

        .inputBox .flexBox {
            align-items: stretch !important;
            height: 100%;
            flex-wrap: nowrap;
        }

        @media screen and (max-width: 930px) {

            .aiMsg,
            .userMsg {
                display: flex;
                flex-direction: column;
                width: 100%;
                margin: auto;
                gap: 4px;
            }

            .mediaWrapper>div {
                flex: 1 1 100%;
            }

            .promptContainer {
                flex-direction: column;
            }

            .promptBox {
                flex: 1 1 100%;
            }

            .responseBox {
                padding: 32px;
            }

            .nav {
                padding-left: 32px;
            }

            .xbttn {
                right: 32px;
            }

            .responseBox p {
                font-size: 18px;
                letter-spacing: -0.5px;
                line-height: calc(20px * 1.2);
                margin-bottom: 20px;
                color: black;
            }

            .inputBox {
                height: fit-content;
                height: 72px;
                width: calc(100% - 32px);
                bottom: 16px;
            }

            input[type=text] {
                font-size: 18px;
                letter-spacing: -0.5px;
                touch-action: auto;
            }

            .promptContainer {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .promptBox {
                width: 100%;
                gap: 4px;
            }

            .aiBox {
            height: calc(100% - 76px);
        }
        }
    </style>
</body>

</html>
<script src="aiMode.js"></script>
